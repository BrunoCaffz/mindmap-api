<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa no celular, modo escuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mascot{filter:var(--mfilter);pointer-events:none;user-select:none}
.bob{animation:mbob 3s ease-in-out infinite}
.lean{transform-origin:0% 100%;animation:lean 3.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@media (max-width: 1100px){.peekdog{display:none}}
a{color:var(--primary)}
.nd{position:absolute;display:flex;flex-direction:column;align-items:center;width:130px;min-height:44px;padding:0;border:0;background:transparent;color:var(--text);font:inherit}
.pop{display:flex;flex-direction:column;align-items:center;transform:scale(0);opacity:0;animation:pop 520ms cubic-bezier(.3,1.5,.5,1) forwards}
.circ{box-sizing:border-box;border-radius:50%;transition:transform 160ms cubic-bezier(.3,1.5,.5,1)}
.nd:active .circ{transform:scale(.9)}
.ln{stroke-dasharray:300;stroke-dashoffset:300;stroke-linecap:round;stroke-width:2;animation:draw 800ms cubic-bezier(.4,0,.2,1) forwards}
.sb-blue{stroke:var(--c-blue)}.sb-purple{stroke:var(--c-purple)}.sb-green{stroke:var(--c-green)}.sb-orange{stroke:var(--c-orange)}.sb-red{stroke:var(--c-red)}
.sheet{transition:transform 380ms cubic-bezier(.32,.72,0,1)}
.k{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.fdog{fill:var(--dog)}.fear{fill:var(--ear)}.fface{fill:var(--face)}.fstar{fill:#F5C84C}
.sdet{stroke:var(--det);fill:none;stroke-width:1.8;stroke-linecap:round}
.wag{transform-box:fill-box;transform-origin:100% 100%;animation:wag .45s ease-in-out infinite alternate}
.glint{animation:glint 3.5s ease-in-out infinite}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes glint{0%,80%,100%{opacity:0}88%{opacity:1}}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.pop{transform:none;opacity:1}.ln{stroke-dashoffset:0}}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI Variable Text&quot;, &quot;Segoe UI&quot;, Helvetica, sans-serif; font-size: 15px; line-height: 1.5">
<header style="position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 2">
<button aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
</button>
<div style="flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">IAM - Identity and Access Management</div>
<button aria-label="Baixar mapa" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</header>

<div style="position: absolute; top: 92px; left: 0; width: 390px; height: 470px">
<svg width="390" height="470" viewBox="0 0 390 470" fill="none" aria-hidden="true" style="position: absolute; inset: 0">
<path class="ln sb-blue" style="animation-delay: .1s" d="M195 74 L80 190"></path>
<path class="ln sb-purple" style="animation-delay: .15s" d="M195 74 L310 190"></path>
<path class="ln sb-red" style="animation-delay: .2s" d="M195 74 L195 300"></path>
<path class="ln sb-green" style="animation-delay: .25s" d="M195 74 L80 400"></path>
<path class="ln sb-orange" style="animation-delay: .3s" d="M195 74 L310 400"></path>
</svg>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
<button class="nd" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="left: {{n.x}}px; top: {{n.y}}px; transform: {{n.tf}}">
<span class="pop" style="animation-delay: {{n.delay}}">
<span class="circ" style="width: {{n.d}}px; height: {{n.d}}px; background: {{n.fill}}; border: 3px solid {{n.c}}; box-shadow: {{n.shadow}}"></span>
<span style="margin-top: 6px; max-width: 130px; text-align: center; font-size: {{n.fs}}; font-weight: 700; line-height: 1.3">{{n.label}}</span>
</span>
</button>
</sc-for>
</div>

<div class="sheet" role="dialog" aria-label="Espiada da página" style="position: absolute; left: 0; right: 0; bottom: 0; height: 290px; transform: {{sheetY}}; background: var(--bg); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); border-top: 1px solid var(--border); padding: 8px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; z-index: 3">
<button aria-label="Fechar espiada" onClick="{{close}}" style="align-self: center; width: 64px; height: 24px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 36px; height: 5px; border-radius: 3px; background: var(--border)"></span>
</button>
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: {{peek.tint}}; border: 3px solid {{peek.c}}"></span>
<div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">{{peek.title}}</div>
</div>
<sc-for list="{{peek.lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; gap: 8px; color: var(--muted)"><span aria-hidden="true">&#8226;</span><span>{{l}}</span></div>
</sc-for>
<div style="flex: 1"></div>
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; background: var(--primary); color: #FFFFFF; text-decoration: none; font-weight: 600">Abrir no Notion</a>
</div>

<sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
<img class="mascot bob" src="/_blob/8d9f62dc316165f0468142eb0a0406f9" alt="" width="110" height="82" style="position: absolute; right: 22px; bottom: 80px; z-index: 2">
<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 8px; z-index: 2">
<button style="flex: 1; height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.08)">Formato: Mapa mental</button>
<button aria-label="Caber na tela" style="width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.08); display: inline-flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
<div style="position: absolute; top: 66px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted)">Toque num galho pra espiar</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    const t = dark ? {
      bg: '#191919', text: '#D4D4D4', muted: '#9B9B9B', border: '#2F2F2F', canvas: '#1C1C1C', grid: '#2E2E2E', primary: '#1A73D4', root: '#2F86E0',
      mfilter: 'invert(1) brightness(.86)', ink: '#E6E3DE', face: '#1F1E1C', dog: '#EFE5D6', ear: '#CDBBA2', det: '#8E8476',
      'c-blue': '#5E9FE0', 'c-purple': '#A47BD6', 'c-green': '#4DAB7A', 'c-orange': '#E0873E', 'c-red': '#E66A64',
      't-blue': '#143A4E', 't-purple': '#3C2D49', 't-green': '#243D30', 't-orange': '#5C3B23', 't-red': '#522E2A'
    } : {
      bg: '#FFFFFF', text: '#37352F', muted: '#73726E', border: '#E9E9E7', canvas: '#FBFBFA', grid: '#E3E2DE', primary: '#0B6BCB', root: '#2383E2',
      mfilter: 'none', ink: '#1F1E1C', face: '#1F1E1C', dog: '#2B2927', ear: '#4B4743', det: '#8A847B',
      'c-blue': '#337EA9', 'c-purple': '#9065B0', 'c-green': '#448361', 'c-orange': '#D9730D', 'c-red': '#D44C47',
      't-blue': '#E7F3F8', 't-purple': '#F4F0F7', 't-green': '#EDF3EC', 't-orange': '#FBECDD', 't-red': '#FDEBEC'
    };
    return Object.keys(t).map((k) => '--' + k + ': ' + t[k]).join('; ') + ';';
  }
  renderVals() {
    const s = this.state || {};
    const dark = this.props.dark ?? true;
    const sel = s.sel === undefined ? 'ak' : s.sel;
    const raw = [
      { id: 'root', label: 'IAM', x: 195, y: 74, color: 'blue', root: true, lines: ['8 tópicos principais', 'Anotações de estudo pra certificação AWS'] },
      { id: 'ak', label: 'Access Keys', x: 80, y: 190, color: 'blue', lines: ['Acesso pela CLI, SDKs e APIs', 'Nunca no código-fonte nem no GitHub', 'Entram no Shared Responsibility Model'] },
      { id: 'pol', label: 'IAM política de estruturas', x: 310, y: 190, color: 'purple', lines: ['Version, Id e Statement', 'Cada Statement descreve uma permissão'] },
      { id: 'st', label: 'Estrutura de um Statement', x: 195, y: 300, color: 'red', lines: ['Sid, Effect, Action e Resource', 'Tem um exemplo completo em JSON'] },
      { id: 'grp', label: 'Grupos e usuários', x: 80, y: 400, color: 'green', lines: ['Grupos só contêm usuários', 'Um usuário pode estar em vários grupos'] },
      { id: 'sdk', label: 'O que é a AWS SDK?!', x: 310, y: 400, color: 'orange', lines: ['IAM Guidelines & Best Practices', 'IAM Security Tools'] }
    ];
    const nodes = raw.map((n, i) => {
      const on = n.id === sel;
      const r = n.root ? 26 : 18;
      return {
        ...n,
        d: r * 2,
        tf: 'translate(-50%,-' + r + 'px)',
        delay: (n.root ? 0 : 0.15 + i * 0.06).toFixed(2) + 's',
        fill: n.root ? 'var(--root)' : 'var(--t-' + n.color + ')',
        c: n.root ? 'transparent' : 'var(--c-' + n.color + ')',
        shadow: on ? '0 0 0 5px var(--t-' + n.color + '), 0 0 0 6px var(--c-' + n.color + ')' : 'none',
        fs: n.root ? '16px' : '13px',
        pressed: String(on),
        pick: () => this.setState({ sel: n.id })
      };
    });
    const cur = raw.find((n) => n.id === sel) || raw[1];
    return {
      vars: this.theme(dark),
      nodes,
      noSel: !sel,
      sheetY: sel ? 'translateY(0)' : 'translateY(110%)',
      peek: { title: cur.label, c: 'var(--c-' + cur.color + ')', tint: 'var(--t-' + cur.color + ')', lines: cur.lines },
      close: () => this.setState({ sel: null })
    };
  }
}
</script>
</body>
</html>
