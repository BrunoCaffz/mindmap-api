<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desenhando o mapa, modo escuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mascot{filter:var(--mfilter);pointer-events:none;user-select:none}
.bob{animation:mbob 3s ease-in-out infinite}
.lean{transform-origin:0% 100%;animation:lean 3.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@media (max-width: 1100px){.peekdog{display:none}}
a{color:var(--primary)}
.ghost{transition:background-color 120ms ease-out}
.ghost:hover{background:var(--hover)}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;width:160px;transition:opacity 360ms ease-out, transform 480ms cubic-bezier(.3,1.5,.5,1)}
.br{stroke-dasharray:420;stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1)}
.bar{transition:width 900ms cubic-bezier(.4,0,.2,1)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.sb-blue{stroke:var(--c-blue)}.sb-purple{stroke:var(--c-purple)}.sb-green{stroke:var(--c-green)}.sb-orange{stroke:var(--c-orange)}.sb-pink{stroke:var(--c-pink)}.sb-red{stroke:var(--c-red)}
.k{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.fcat{fill:var(--cat)}.fbelly{fill:var(--belly)}.fhat{fill:var(--hat)}.fface{fill:var(--face)}.fstar{fill:#F5C84C}
.sface{stroke:var(--face);fill:none;stroke-width:2;stroke-linecap:round}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.wandarm{transform-box:view-box;transform-origin:118px 126px;animation:cast 1.1s ease-in-out infinite}
.wandstar{transform-box:fill-box;transform-origin:center;animation:twirl 1.1s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 1.1s ease-in-out infinite}.s2{animation-delay:.35s}.s3{animation-delay:.7s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cast{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes twirl{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(30deg) scale(1.2)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@media (hover:hover) and (pointer:fine){.nocur,.nocur *{cursor:none!important}}
@media (hover:none){.cur{display:none}}
.cur{position:fixed;left:0;top:0;pointer-events:none;mix-blend-mode:difference;z-index:9999}
.cring,.cdot{width:0;height:0;opacity:0;transition:opacity 200ms}
.px{position:absolute;left:-1px;top:-1px;width:2px;height:2px;background:#F2EDE8;will-change:transform,opacity}
.cdot .px{left:-2px;top:-2px;width:4px;height:4px;border-radius:1px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="nocur" onMouseMove="{{onMove}}" onMouseOver="{{onOver}}" onMouseLeave="{{onLeave}}" onMouseDown="{{onDown}}" onMouseUp="{{onUp}}" style="{{vars}} min-height: 900px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI Variable Text&quot;, &quot;Segoe UI&quot;, Helvetica, sans-serif; font-size: 14px; line-height: 1.5">
<nav aria-label="Opções do mapa" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; opacity: .55">
<div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; font-weight: 600">
<span style="width: 22px; height: 22px; border-radius: 5px; background: var(--text)"></span>Notion Mindmap
</div>
<div style="margin: 18px 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted)">Formato</div>
<div style="height: 36px; display: flex; align-items: center; padding: 0 8px; border-radius: 6px; background: var(--active); font-weight: 600">Mapa mental</div>
<div style="height: 36px; display: flex; align-items: center; padding: 0 8px">Árvore</div>
<div style="height: 36px; display: flex; align-items: center; padding: 0 8px">Radial</div>
<div style="height: 36px; display: flex; align-items: center; padding: 0 8px">Bolhas</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; position: relative">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--border)">
<div class="bar" style="height: 2px; background: var(--root); width: {{pct}}"></div>
</div>
<header style="height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px 0 16px">
<div style="display: flex; align-items: center; gap: 6px; color: var(--muted)">
<span>Mapas</span><span aria-hidden="true">/</span><span style="color: var(--text)">IAM - Identity and Access Management</span>
</div>
<button class="ghost" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit">Cancelar</button>
</header>

<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 16px 64px; gap: 20px">
<div style="width: 100%; max-width: 760px; overflow-x: auto">
<div role="img" aria-label="Mapa sendo desenhado, galho por galho" style="position: relative; width: 760px; height: 420px; margin: 0 auto">
<svg width="760" height="420" viewBox="0 0 760 420" fill="none" aria-hidden="true" style="position: absolute; inset: 0">
<path class="br sb-blue" d="M380 210 L220 90" style="stroke-dashoffset: {{o.s2}}"></path>
<path class="br sb-red" d="M380 210 L150 250" style="stroke-dashoffset: {{o.s3}}"></path>
<path class="br sb-green" d="M380 210 L270 360" style="stroke-dashoffset: {{o.s3}}"></path>
<path class="br sb-purple" d="M380 210 L560 80" style="stroke-dashoffset: {{o.s4}}"></path>
<path class="br sb-pink" d="M380 210 L620 230" style="stroke-dashoffset: {{o.s4}}"></path>
<path class="br sb-orange" d="M380 210 L500 360" style="stroke-dashoffset: {{o.s5}}"></path>
<path class="br sb-blue" style="stroke-width: 1.5; stroke-dashoffset: {{o.s6}}" d="M220 90 L120 56 M220 90 L176 26"></path>
<path class="br sb-red" style="stroke-width: 1.5; stroke-dashoffset: {{o.s6}}" d="M150 250 L56 206 M150 250 L52 300"></path>
<path class="br sb-purple" style="stroke-width: 1.5; stroke-dashoffset: {{o.s6}}" d="M560 80 L676 40 M560 80 L690 112"></path>
<path class="br sb-pink" style="stroke-width: 1.5; stroke-dashoffset: {{o.s6}}" d="M620 230 L726 276"></path>
</svg>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="12">
<div class="node" style="left: {{n.x}}px; top: {{n.y}}px; opacity: {{n.op}}; transform: {{n.tf}}">
<span style="width: {{n.d}}px; height: {{n.d}}px; box-sizing: border-box; border-radius: 50%; background: {{n.fill}}; border: {{n.bw}} solid {{n.c}}"></span>
<span style="margin-top: 6px; max-width: 160px; text-align: center; font-size: {{n.fs}}; font-weight: {{n.fw}}; line-height: 1.3">{{n.label}}</span>
</div>
</sc-for>
</div>
</div>

<div role="status" aria-live="polite" style="display: flex; align-items: center; gap: 16px">
<img class="mascot bob" src="/_blob/4c11e2ca06f0999d449a4995bdaef4f2" alt="" width="72" height="96">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">
<span class="pulse" style="width: 8px; height: 8px; border-radius: 4px; background: var(--root)"></span>
{{msg}}
</div>
<div style="font-size: 13px; color: var(--muted)">{{count}} blocos lidos até agora. Páginas grandes levam mais um tempinho.</div>
</div>
</div>
</div>
</main>

<div class="cur cring" aria-hidden="true"><sc-for list="{{curPts}}" as="p" hint-placeholder-count="20"><span class="px"></span></sc-for></div>
<div class="cur cdot" aria-hidden="true"><span class="px"></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"speed":{"editor":"range","default":1100,"min":500,"max":2500,"step":100,"unit":"ms"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  theme(dark) {
    const t = dark ? {
      bg: '#191919', side: '#202020', text: '#D4D4D4', muted: '#9B9B9B', border: '#2F2F2F', hover: '#2C2C2C', active: '#323232',
      mfilter: 'invert(1) brightness(.86)', ink: '#E6E3DE', face: '#1F1E1C', cat: '#45C4D9', belly: '#D9F5FA', hat: '#8E6FD8', primary: '#1A73D4', root: '#2F86E0',
      'c-blue': '#5E9FE0', 'c-purple': '#A47BD6', 'c-green': '#4DAB7A', 'c-orange': '#E0873E', 'c-pink': '#D669A5', 'c-red': '#E66A64',
      't-blue': '#143A4E', 't-purple': '#3C2D49', 't-green': '#243D30', 't-orange': '#5C3B23', 't-pink': '#4E2C3C', 't-red': '#522E2A'
    } : {
      bg: '#FFFFFF', side: '#F7F7F5', text: '#37352F', muted: '#73726E', border: '#E9E9E7', hover: '#EFEFED', active: '#E8E8E5',
      mfilter: 'none', ink: '#1F1E1C', face: '#1F1E1C', cat: '#F59A45', belly: '#FFF1E2', hat: '#6E56B5', primary: '#0B6BCB', root: '#2383E2',
      'c-blue': '#337EA9', 'c-purple': '#9065B0', 'c-green': '#448361', 'c-orange': '#D9730D', 'c-pink': '#C14C8A', 'c-red': '#D44C47',
      't-blue': '#E7F3F8', 't-purple': '#F4F0F7', 't-green': '#EDF3EC', 't-orange': '#FBECDD', 't-pink': '#FAF1F5', 't-red': '#FDEBEC'
    };
    return Object.keys(t).map((k) => '--' + k + ': ' + t[k]).join('; ') + ';';
  }
  startCursor() {
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.cx = { mx: -100, my: -100, rx: -100, ry: -100, r: 14, t: 0, on: false, hot: false, down: false };
    let last = performance.now();
    const tick = (now) => {
      const c = this.cx;
      const dt = Math.min(0.05, (now - last) / 1000); last = now; c.t += dt;
      const ring = document.querySelector('.cring');
      const dot = document.querySelector('.cdot');
      if (ring && dot) {
        const follow = reduce ? 1 : 1 - Math.pow(0.0005, dt);
        c.rx += (c.mx - c.rx) * follow; c.ry += (c.my - c.ry) * follow;
        const target = c.down ? 8 : c.hot ? 22 : 14;
        c.r += (target - c.r) * (1 - Math.pow(0.001, dt));
        ring.style.opacity = dot.style.opacity = c.on ? '1' : '0';
        ring.style.transform = 'translate3d(' + c.rx + 'px,' + c.ry + 'px,0)';
        dot.style.transform = 'translate3d(' + c.mx + 'px,' + c.my + 'px,0)';
        const pts = ring.querySelectorAll('.px');
        const n = pts.length;
        for (let i = 0; i < n; i++) {
          const base = (i / n) * Math.PI * 2;
          const a = reduce ? base : base + c.t * 1.1;
          const breathe = reduce ? 0 : Math.sin(c.t * 2.6) * 3 + Math.sin(c.t * 4 + i * 0.9) * 1.2;
          const rad = c.r + breathe;
          const x = Math.round((Math.cos(a) * rad) / 2) * 2;
          const y = Math.round((Math.sin(a) * rad) / 2) * 2;
          pts[i].style.transform = 'translate(' + x + 'px,' + y + 'px)';
          pts[i].style.opacity = reduce ? '1' : (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(c.t * 5 + i * 1.7))).toFixed(2);
        }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentDidMount() {
    this.startCursor();
    this.timer = setInterval(() => {
      const s = (this.state && this.state.step) || 0;
      this.setState({ step: (s + 1) % 9 });
    }, this.props.speed ?? 1100);
  }
  componentWillUnmount() { clearInterval(this.timer); cancelAnimationFrame(this.raf); }
  renderVals() {
    const s = this.state || {};
    const dark = this.props.dark ?? true;
    const step = s.step || 0;
    const msgs = [
      'Abrindo a página no Notion',
      'Lendo os títulos, um por um',
      'Abrindo os toggles que você deixou fechados',
      'Achando as subpáginas',
      'Puxando cada galho pro seu lugar',
      'Pintando os ramos',
      'Só alinhando as pontas',
      'Pronto, abrindo o mapa',
      'Pronto, abrindo o mapa'
    ];
    const show = (at) => step >= at;
    const node = (label, x, y, at, color, kind) => {
      const r = kind === 'root' ? 28 : kind === 'kid' ? 7 : 17;
      return {
        label, x, y,
        d: r * 2,
        c: kind === 'root' ? 'transparent' : 'var(--c-' + color + ')',
        fill: kind === 'root' ? 'var(--root)' : 'var(--t-' + color + ')',
        bw: kind === 'kid' ? '2px' : '2.5px',
        fs: kind === 'root' ? '15px' : '13px',
        fw: kind === 'root' ? 700 : 600,
        op: show(at) ? 1 : 0,
        tf: 'translate(-50%,-' + r + 'px) scale(' + (show(at) ? 1 : 0.4) + ')'
      };
    };
    const nodes = [
      node('IAM - Identity and Access Management', 380, 210, 0, 'blue', 'root'),
      node('Access Keys', 220, 90, 2, 'blue'),
      node('Estrutura de um Statement', 150, 250, 3, 'red'),
      node('Permissões', 270, 360, 3, 'green'),
      node('IAM política de estruturas', 560, 80, 4, 'purple'),
      node('Grupos e usuários', 620, 230, 4, 'pink'),
      node('O que é a AWS SDK?!', 500, 360, 5, 'orange'),
      node('', 120, 56, 6, 'blue', 'kid'), node('', 176, 26, 6, 'blue', 'kid'),
      node('', 56, 206, 6, 'red', 'kid'), node('', 52, 300, 6, 'red', 'kid'),
      node('', 676, 40, 6, 'purple', 'kid'), node('', 690, 112, 6, 'purple', 'kid'),
      node('', 726, 276, 6, 'pink', 'kid')
    ];
    const off = (at) => (show(at) ? 0 : 420);
    return {
      vars: this.theme(dark),
      nodes,
      o: { s2: off(2), s3: off(3), s4: off(4), s5: off(5), s6: off(6) },
      msg: msgs[step],
      count: [0, 12, 31, 47, 58, 64, 64, 64, 64][step],
      pct: Math.min(100, Math.round((step / 7) * 100)) + '%',
      curPts: Array.from({ length: 20 }, (_, i) => ({ i })),
      onMove: (e) => { const c = this.cx; if (!c) return; c.mx = e.clientX; c.my = e.clientY; if (!c.on) { c.on = true; c.rx = c.mx; c.ry = c.my; } },
      onOver: (e) => { const el = e.target; if (this.cx) this.cx.hot = !!(el && el.closest && el.closest('a,button,input,label')); },
      onLeave: () => { if (this.cx) this.cx.on = false; },
      onDown: () => { if (this.cx) this.cx.down = true; },
      onUp: () => { if (this.cx) this.cx.down = false; }
    };
  }
}
</script>
</body>
</html>
